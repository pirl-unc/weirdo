# Frozen seed selections for future Weirdo variable-length taxonomy training.
#
# These accessions identify UniProt *reference proteomes*, a selected set of
# UniProtKB records.  They are not independent files to combine with SwissProt:
# create a new corpus from these selected reference proteomes, deduplicate exact
# sequences while retaining multi-leaf membership, then balance at species and
# leaf level.  Exact host-self lookup searches the selected host proteome alone.
schema_version: 1
name: reference-proteomes-v1
created: 2026-10-23
source:
  catalog: UniProt reference-proteome REST catalog
  reference_only: true
  mammals_query: 'taxonomy_id:40674 AND proteome_type:REFERENCE'
  viruses_query: 'taxonomy_id:10239 AND proteome_type:REFERENCE'
  catalog_counts_at_freeze:
    mammals: 158
    viruses: 15030
selection_policy:
  mammals: Diverse, complete vertebrate hosts; use primates, glires, carnivora, and other_mammals as mutually exclusive training leaves; retain every selected sequence for exact self lookup.
  viruses: 128 accessions per major viral realm, sorted by UPID at freeze time.
  training: Do not weight raw protein or amino-acid totals equally; deduplicate and cap/sample balance species and leaves.
  provenance: Record each downloaded FASTA SHA-256 and the catalog modified time with every training run.

