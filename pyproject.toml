[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "weirdo"
requires-python = ">=3.11"
authors = [{name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu"}]
description = "Metrics of immunological foreignness for candidate T-cell epitopes"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "weirdo.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["weirdo*"]

[tool.setuptools.package-data]
weirdo = [
    "logging.conf",
    "pretrained/*.json",
    "pretrained/*/*",
    "pretrained/*/*/*",
    "pretrained/*/*/*/*",
    "reference_proteome_manifests/*.yaml",
]

[project.urls]
"Homepage" = "https://github.com/pirl-unc/weirdo"
"Bug Tracker" = "https://github.com/pirl-unc/weirdo/issues"

[project.scripts]
weirdo = "weirdo.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "tqdm>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
benchmark = [
    "datacache>=1.38.0,<2.0.0",
    "mhcflurry>=2.3.0",
    "statsmodels>=0.14",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F821", "E501", "F841", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/*" = ["F401"]
